# docker-compose.yml - без version (для Docker Compose V2)

services:
  db:
    image: mariadb:10.11
    container_name: crm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crm_db}
      MYSQL_USER: ${MYSQL_USER:-crm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_password_here}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build: ./backend
    container_name: crm_backend
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-crm_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-secure_password_here}
      - DB_NAME=${MYSQL_DATABASE:-crm_db}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-me}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: ./bot
    container_name: crm_bot
    restart: unless-stopped
    environment:
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - CRM_API_URL=http://backend:8000/api/messages
    depends_on:
      - backend
    networks:
      - crm_network

  frontend:
    build: ./frontend
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  backend_uploads:
    driver: local
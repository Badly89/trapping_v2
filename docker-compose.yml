# docker-compose.yml
services:
  db:
    image: mariadb:10.11
    container_name: crm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    ports:
      - "3308:3306"  # Новый порт для MySQL на хосте

  backend:
    build: ./backend
    container_name: crm_backend
    restart: unless-stopped
    ports:
      - "6005:8000"   # хост:контейнер
    environment:
      - DB_HOST=db                    # Используем имя сервиса, а не переменную
      - DB_PORT=3306                  # Внутренний порт контейнера
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: ./bot
    container_name: crm_bot
    restart: unless-stopped
    environment:
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - CRM_API_URL=http://backend:8000/api/messages
    depends_on:
      - backend
    networks:
      - crm_network

  frontend:
  build: ./frontend
  container_name: crm_frontend
  restart: unless-stopped
  ports:
    - "89:89"  # хост:контейнер
  environment:
    - REACT_APP_API_URL=${REACT_APP_API_URL:-http://10.87.0.59:6005/api}
  depends_on:
    - backend
  networks:
    - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  backend_uploads:
    driver: local
# docker-compose.yml
services:
  db:
    image: mariadb:10.11
    container_name: crm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    ports:
      - "3308:3306"  # Новый порт для MySQL

   backend:
    build: ./backend
    container_name: crm_backend
    restart: unless-stopped
    ports:
      - "6005:8000"   # хост:контейнер
    environment:
      - DB_HOST=${DB_HOST:-your_db_host}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-crm_user}
      - DB_PASSWORD=${DB_PASSWORD:-secure_password}
      - DB_NAME=${DB_NAME:-crm_db}
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build: ./bot
    container_name: crm_bot
    restart: unless-stopped
    environment:
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN}
      - CRM_API_URL=http://backend:8000/api/messages
    depends_on:
      - backend
    networks:
      - crm_network

   frontend:
    build: ./frontend
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "8181:80"
    depends_on:
      - crm_backend

networks:
  crm_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  backend_uploads:
    driver: local
services:
  db:
    image: mariadb:10.11
    container_name: crm_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm-network

  backend:
    build: ./backend
    container_name: crm_backend
    restart: unless-stopped
    ports:
      - "6005:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    networks:
      - crm-network

  frontend:
    build: ./frontend
    container_name: crm_frontend
    restart: unless-stopped
    ports:
      - "85:85"      # ← ТОЛЬКО ЭТО МЕНЯЕМ: 85:80
    depends_on:
      - backend
    networks:
      - crm-network

  bot:
    build: ./bot
    container_name: crm_bot
    restart: unless-stopped
    env_file:
      - ./bot/.env
    depends_on:
      - backend
    networks:
      - crm-network

networks:
  crm-network:
    driver: bridge

volumes:
  db_data: